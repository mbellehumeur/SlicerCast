<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">CAST Request Event Flow</title>
  <desc id="desc">Animated Cast request flow: context-request, CT load, report-request, then right-click measurement menu on the CT slice.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1b5f" flood-opacity="0.14"/>
    </filter>
    <clipPath id="ctClip">
      <rect x="255" y="108" width="200" height="150" rx="10"/>
    </clipPath>
    <radialGradient id="ctVignette" cx="50%" cy="50%" r="65%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #06146b; }
      .heading { font: 700 24px Arial, Helvetica, sans-serif; fill: #06146b; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #06146b; }
      .small { font: 16px Arial, Helvetica, sans-serif; fill: #06146b; }
      .panel { fill: #fff; stroke: #cfe0ff; stroke-width: 2; filter: url(#shadow); }
      .connWs { fill: none; stroke: #2457d6; stroke-width: 4; stroke-linecap: round; }
      .packetText { font: 700 11px Arial, Helvetica, sans-serif; fill: #fff; }
      .packetSub { font: 600 9px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .packetSubPost { font: 600 9px Arial, Helvetica, sans-serif; fill: #ecfdf5; }
      .launchMsg { font: 700 18px Arial, Helvetica, sans-serif; fill: #06146b; }

      #imageDisplay {
        animation: imageDisplayReveal 30s infinite;
      }
      @keyframes imageDisplayReveal {
        0%, 8% { opacity: 0; }
        10%, 100% { opacity: 1; }
      }

      #imageDisplayLaunch {
        animation: imageDisplayLaunch 30s infinite;
      }
      @keyframes imageDisplayLaunch {
        0%, 8% { opacity: 1; }
        10%, 99% { opacity: 0; }
        100% { opacity: 1; }
      }

      #castHubGraphic { transform-origin: 0px 0px; animation: hubPulse 30s infinite; }
      @keyframes hubPulse {
        0%, 14% { transform: scale(1); }
        16.4%, 38.4% { transform: scale(1.06); }
        41.7%, 52.2% { transform: scale(1); }
        57.1%, 73.4% { transform: scale(1.06); }
        76.7%, 100% { transform: scale(1); }
      }
      #hubBroadcastArcs { opacity: 0.4; animation: hubBroadcastArcs 30s infinite; }
      @keyframes hubBroadcastArcs {
        0%, 17.99% { opacity: 0.4; }
        18%, 39% { opacity: 1; }
        39.01%, 57.99% { opacity: 0.4; }
        58%, 76% { opacity: 1; }
        76.01%, 100% { opacity: 0.4; }
      }

      .packetWaiting {
        opacity: 0;
        animation: packetWaiting 30s infinite;
      }
      @keyframes packetWaiting {
        0%, 9% { opacity: 0; transform: translate(600px, 270px); }
        10% { opacity: 1; transform: translate(600px, 270px); }
        14% { opacity: 1; transform: translate(600px, 390px); }
        38.4% { opacity: 1; transform: translate(600px, 390px); }
        44.9% { opacity: 1; transform: translate(600px, 270px); }
        48.2% { opacity: 1; transform: translate(600px, 270px); }
        52.2%, 100% { opacity: 0; transform: translate(600px, 270px); }
      }

      .packetFanout {
        opacity: 0;
        animation: packetFanout 30s infinite;
      }
      @keyframes packetFanout {
        0%, 18.1% { opacity: 0; transform: translate(600px, 390px); }
        18.9% { opacity: 1; transform: translate(600px, 390px); }
        24.5% { opacity: 1; transform: translate(300px, 460px); }
        27% { opacity: 1; transform: translate(300px, 455px); }
        29.4%, 100% { opacity: 0; transform: translate(300px, 455px); }
      }

      .packetResponse {
        opacity: 0;
        animation: packetResponse 30s infinite;
      }
      @keyframes packetResponse {
        0%, 29.4% { opacity: 0; transform: translate(300px, 455px); }
        30.3% { opacity: 1; transform: translate(300px, 455px); }
        34.4% { opacity: 1; transform: translate(300px, 460px); }
        36.8% { opacity: 1; transform: translate(600px, 390px); }
        39.3%, 100% { opacity: 0; transform: translate(600px, 390px); }
      }

      #ctResult {
        opacity: 0;
        transform-origin: 355px 182px;
        animation: ctResult 30s infinite;
      }
      @keyframes ctResult {
        0%, 47.4% { opacity: 0; transform: scale(0.92); }
        48.2% { opacity: 1; transform: scale(1); }
        81.5%, 100% { opacity: 1; transform: scale(1); }
      }

      .packetReportPost {
        opacity: 0;
        animation: packetReportPost 30s infinite;
      }
      @keyframes packetReportPost {
        0%, 52.2% { opacity: 0; transform: translate(600px, 270px); }
        53.9% { opacity: 1; transform: translate(600px, 270px); }
        57.1% { opacity: 1; transform: translate(600px, 390px); }
        73.4% { opacity: 1; transform: translate(600px, 390px); }
        78.3% { opacity: 1; transform: translate(600px, 270px); }
        80.7% { opacity: 1; transform: translate(600px, 270px); }
        83.2%, 100% { opacity: 0; transform: translate(600px, 270px); }
      }

      .packetReportFanout {
        opacity: 0;
        animation: packetReportFanout 30s infinite;
      }
      @keyframes packetReportFanout {
        0%, 58.8% { opacity: 0; transform: translate(600px, 390px); }
        60.4% { opacity: 1; transform: translate(600px, 390px); }
        63.7% { opacity: 1; transform: translate(900px, 460px); }
        65.3% { opacity: 1; transform: translate(900px, 455px); }
        66.9%, 100% { opacity: 0; transform: translate(900px, 455px); }
      }

      .packetReportResponse {
        opacity: 0;
        animation: packetReportResponse 30s infinite;
      }
      @keyframes packetReportResponse {
        0%, 66.9% { opacity: 0; transform: translate(900px, 455px); }
        68.5% { opacity: 1; transform: translate(900px, 455px); }
        71% { opacity: 1; transform: translate(900px, 460px); }
        73.4% { opacity: 1; transform: translate(600px, 390px); }
        75.9%, 100% { opacity: 0; transform: translate(600px, 390px); }
      }

      #reportResult {
        opacity: 0;
        transform-origin: 845px 182px;
        animation: reportResult 30s infinite;
      }
      @keyframes reportResult {
        0%, 79.2% { opacity: 0; transform: scale(0.92); }
        80.7% { opacity: 1; transform: scale(1); }
        81.5%, 100% { opacity: 1; transform: scale(1); }
      }

      #ctPointerAnim {
        opacity: 0;
        animation: ctPointerAnim 30s infinite;
      }
      @keyframes ctPointerAnim {
        0%, 84% { opacity: 0; }
        85% { opacity: 1; }
        97%, 100% { opacity: 1; }
      }

      #ctContextMenuAnim {
        opacity: 0;
        transform-origin: 340px 198px;
        transform: scale(0.94);
        animation: ctContextMenuAnim 30s infinite;
      }
      @keyframes ctContextMenuAnim {
        0%, 86% { opacity: 0; transform: scale(0.94); }
        87% { opacity: 1; transform: scale(1); }
        97%, 100% { opacity: 1; transform: scale(1); }
      }

      #contextRequestCaption {
        opacity: 0;
        animation: contextRequestCaption 30s infinite;
      }
      @keyframes contextRequestCaption {
        0%, 9.5% { opacity: 0; }
        10% { opacity: 1; }
        46% { opacity: 1; }
        47.5%, 100% { opacity: 0; }
      }

      #reportRequestCaption {
        opacity: 0;
        animation: reportRequestCaption 30s infinite;
      }
      @keyframes reportRequestCaption {
        0%, 53.5% { opacity: 0; }
        54% { opacity: 1; }
        79% { opacity: 1; }
        80.5%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" class="title">Request events: how to get the information you need.</text>

  <!-- Connector lines (behind panels) -->
  <path class="connWs" d="M600 390 L600 270"/>
  <path class="connWs" d="M600 390 L300 542"/>
  <path class="connWs" d="M600 390 L900 542"/>

  <!-- Image Display launch (no URL parameters) -->
  <g id="imageDisplayLaunch">
    <rect class="panel" x="475" y="95" width="250" height="175" rx="18" fill="#f8fafc"/>
    <text x="600" y="168" text-anchor="middle" class="launchMsg">Start: Image Display launch</text>
    <text x="600" y="196" text-anchor="middle" class="launchMsg">with no URL parameters</text>
  </g>

  <!-- Image Display -->
  <g id="imageDisplay">
    <rect class="panel" x="475" y="95" width="250" height="175" rx="18"/>
    <rect x="565" y="115" width="70" height="58" rx="12" fill="#6528e0"/>
    <path d="M580 159 L595 141 L607 154 L616 146 L628 159 Z" fill="#fff"/>
    <circle cx="616" cy="133" r="5" fill="#fff"/>
    <text x="600" y="201" text-anchor="middle" class="label">Image Display</text>
    <text x="600" y="227" text-anchor="middle" class="small">View and interact</text>
    <text x="600" y="247" text-anchor="middle" class="small">with medical images</text>
  </g>

  <!-- Caption during context-request (top-left of CT viewport area) -->
  <g id="contextRequestCaption">
    <rect x="262" y="118" width="188" height="48" rx="8" fill="#06146b" opacity="0.88"/>
    <text x="272" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Image Display asks for</text>
    <text x="272" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">worklist context</text>
  </g>

  <!-- CT result appears after the HTTP response returns -->
  <g id="ctResult">
    <rect class="panel" x="245" y="95" width="220" height="175" rx="18"/>
    <rect x="255" y="108" width="200" height="150" rx="10" fill="#0f1115" stroke="#2a3140" stroke-width="2"/>
    <g clip-path="url(#ctClip)">
      <rect x="255" y="108" width="200" height="150" fill="#101014"/>
      <ellipse cx="355" cy="186" rx="78" ry="62" fill="#6f7074"/>
      <ellipse cx="322" cy="182" rx="28" ry="38" fill="#1b1d22"/>
      <ellipse cx="388" cy="182" rx="28" ry="38" fill="#1b1d22"/>
      <ellipse cx="355" cy="196" rx="14" ry="18" fill="#8a8b90"/>
      <ellipse cx="355" cy="228" rx="10" ry="8" fill="#d8d8dc"/>
      <path d="M310 150 Q355 132 400 150" fill="none" stroke="#555860" stroke-width="3" opacity="0.7"/>
      <path d="M302 168 Q355 148 408 168" fill="none" stroke="#555860" stroke-width="3" opacity="0.55"/>
      <path d="M296 186 Q355 164 414 186" fill="none" stroke="#555860" stroke-width="3" opacity="0.45"/>
      <path d="M292 204 Q355 180 418 204" fill="none" stroke="#555860" stroke-width="3" opacity="0.35"/>
      <rect x="255" y="108" width="200" height="150" fill="url(#ctVignette)" opacity="0.35"/>
    </g>
    <text x="355" y="252" text-anchor="middle" class="small">CT Chest</text>
  </g>

  <!-- Caption during report-request (top-left of report template viewport area) -->
  <g id="reportRequestCaption">
    <rect x="752" y="118" width="188" height="48" rx="8" fill="#06146b" opacity="0.88"/>
    <text x="762" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Image Display asks for</text>
    <text x="762" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">report content</text>
  </g>

  <!-- Report template appears after report-request returns to Image Display -->
  <g id="reportResult">
    <rect class="panel" x="735" y="95" width="220" height="175" rx="18"/>
    <rect x="752" y="112" width="186" height="132" rx="8" fill="#fffaf5" stroke="#fed7aa" stroke-width="2"/>
    <rect x="752" y="112" width="186" height="28" rx="8" fill="#f97316"/>
    <rect x="752" y="128" width="186" height="12" fill="#f97316"/>
    <text x="845" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#fff">Report Template</text>
    <text x="764" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7c2d12">Measurement 1</text>
    <line x1="848" y1="152" x2="926" y2="152" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <text x="764" y="170" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7c2d12">Measurement 2</text>
    <line x1="848" y1="170" x2="926" y2="170" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <text x="764" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7c2d12">Measurement 3</text>
    <line x1="848" y1="188" x2="926" y2="188" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <text x="764" y="206" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7c2d12">Measurement 4</text>
    <line x1="848" y1="206" x2="926" y2="206" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <text x="764" y="224" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7c2d12">Measurement 5</text>
    <line x1="848" y1="224" x2="926" y2="224" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Worklist -->
  <g id="worklist">
    <rect class="panel" x="175" y="455" width="250" height="175" rx="18"/>
    <rect x="265" y="475" width="70" height="58" rx="12" fill="#159447"/>
    <circle cx="282" cy="491" r="4" fill="#fff"/>
    <circle cx="282" cy="507" r="4" fill="#fff"/>
    <circle cx="282" cy="523" r="4" fill="#fff"/>
    <line x1="297" y1="491" x2="320" y2="491" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="297" y1="507" x2="320" y2="507" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="297" y1="523" x2="320" y2="523" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="300" y="561" text-anchor="middle" class="label">Worklist</text>
    <text x="300" y="587" text-anchor="middle" class="small">Aggregated exams</text>
    <text x="300" y="607" text-anchor="middle" class="small">by specialty</text>
  </g>

  <!-- Reporting -->
  <g id="reporting">
    <rect class="panel" x="775" y="455" width="250" height="175" rx="18"/>
    <rect x="865" y="475" width="70" height="58" rx="12" fill="#f97316"/>
    <rect x="882" y="509" width="8" height="16" fill="#fff"/>
    <rect x="896" y="497" width="8" height="28" fill="#fff"/>
    <rect x="910" y="485" width="8" height="40" fill="#fff"/>
    <text x="900" y="561" text-anchor="middle" class="label">Reporting</text>
    <text x="900" y="587" text-anchor="middle" class="small">Create, edit and manage</text>
    <text x="900" y="607" text-anchor="middle" class="small">reports</text>
  </g>

  <!-- Cast Hub -->
  <g id="castHub">
    <text x="648" y="368" text-anchor="start" class="heading">Hub</text>
  </g>
  <g transform="translate(600, 390)">
    <g id="castHubGraphic">
      <g transform="rotate(-42)">
        <g id="hubBroadcastArcs" fill="none" stroke="#38bdf8" stroke-linecap="round">
          <path d="M30 -12 A 14 14 0 0 1 30 12" stroke-width="3"/>
          <path d="M38 -20 A 22 22 0 0 1 38 20" stroke-width="2.5" opacity="0.8"/>
          <path d="M46 -28 A 30 30 0 0 1 46 28" stroke-width="2" opacity="0.55"/>
        </g>
        <g id="hubDish">
          <circle cx="0" cy="0" r="20" fill="#e0f2fe" stroke="#1e40af" stroke-width="4"/>
        </g>
      </g>
    </g>
  </g>

  <!-- HTTP POST packet: Image Display → Hub (waits) → Image Display -->
  <g class="packetWaiting">
    <rect x="-78" y="-18" width="156" height="36" rx="18" fill="#1f9d55"/>
    <text x="0" y="-3" text-anchor="middle" class="packetSubPost">HTTP POST</text>
    <text x="0" y="10" text-anchor="middle" class="packetText">context-request</text>
  </g>

  <!-- Fan-out packet: Hub → Worklist -->
  <g class="packetFanout">
    <rect x="-68" y="-14" width="136" height="28" rx="14" fill="#2457d6"/>
    <text x="0" y="5" text-anchor="middle" class="packetText">context-request</text>
  </g>

  <!-- Response packet: Worklist → Hub -->
  <g class="packetResponse">
    <rect x="-72" y="-14" width="144" height="28" rx="14" fill="#2457d6"/>
    <text x="0" y="5" text-anchor="middle" class="packetText">context-response</text>
  </g>

  <!-- HTTP POST packet: Image Display → Hub (report-request) -->
  <g class="packetReportPost">
    <rect x="-78" y="-18" width="156" height="36" rx="18" fill="#1f9d55"/>
    <text x="0" y="-3" text-anchor="middle" class="packetSubPost">HTTP POST</text>
    <text x="0" y="10" text-anchor="middle" class="packetText">report-request</text>
  </g>

  <!-- Fan-out packet: Hub → Reporting -->
  <g class="packetReportFanout">
    <rect x="-68" y="-14" width="136" height="28" rx="14" fill="#2457d6"/>
    <text x="0" y="5" text-anchor="middle" class="packetText">report-request</text>
  </g>

  <!-- Response packet: Reporting → Hub -->
  <g class="packetReportResponse">
    <rect x="-72" y="-14" width="144" height="28" rx="14" fill="#2457d6"/>
    <text x="0" y="5" text-anchor="middle" class="packetText">report-response</text>
  </g>

  <!-- Right-click measurements menu on CT slice (final step) -->
  <g id="ctPointerAnim" transform="translate(328, 176)">
    <path fill="#ffffff" stroke="#000000" stroke-width="1.25" stroke-linejoin="round" d="M0 0V18.5L4.8 14.2H7.8L10.8 22.5L13.2 14.2H17.8V18.5L12.8 11.2L20.5 8L12.8 4.8L0 0Z"/>
  </g>
  <g id="ctContextMenuAnim">
    <rect x="338" y="192" width="168" height="118" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="338" y="192" width="168" height="22" rx="6" fill="#eff6ff"/>
    <text x="350" y="207" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#06146b">Measurement 1</text>
    <line x1="338" y1="214" x2="506" y2="214" stroke="#e2e8f0" stroke-width="1"/>
    <text x="350" y="229" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#06146b">Measurement 2</text>
    <line x1="338" y1="236" x2="506" y2="236" stroke="#e2e8f0" stroke-width="1"/>
    <text x="350" y="251" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#06146b">Measurement 3</text>
    <line x1="338" y1="258" x2="506" y2="258" stroke="#e2e8f0" stroke-width="1"/>
    <text x="350" y="273" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#06146b">Measurement 4</text>
    <line x1="338" y1="280" x2="506" y2="280" stroke="#e2e8f0" stroke-width="1"/>
    <text x="350" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#06146b">Measurement 5</text>
  </g>
</svg>
